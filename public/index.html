<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUSS · Casa inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg:#0b0b0c;
  --card:#111112;
  --bd:#4d4025;
  --tx:#ece6d8;
  --mu:#8f887a;
  --gold:#cfa65e;
  --bad:#e5766c;
  --ok:#a9cf92;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--tx);
  font:300 15px Montserrat,Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(118deg,#0b0b0c,#151516);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{
  padding:20px 12px;
  border-right:1px solid var(--bd);
  background:#090909;
  min-height:100vh;
}
.logo{
  color:var(--gold);
  font-size:22px;
  letter-spacing:7px;
  padding:10px;
}
.logo small{
  display:block;
  color:var(--mu);
  font-size:11px;
  letter-spacing:1px;
}
nav a{
  display:block;
  padding:12px;
  margin:4px 0;
  border:1px solid transparent;
  color:var(--mu);
  cursor:pointer;
  border-radius:4px;
}
nav a:hover,nav a.active{
  color:var(--gold);
  border-color:var(--bd);
}
main{padding:28px;width:100%;max-width:1200px}
h1{font-size:23px;font-weight:300;letter-spacing:3px}
h2{font-size:15px;color:var(--gold);font-weight:400;margin-top:25px}
.sub,.muted{color:var(--mu);font-size:13px}
.card{
  background:#111112;
  border:1px solid var(--bd);
  border-radius:4px;
  padding:16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #4d402555;
}
.btn{
  background:transparent;
  border:1px solid var(--bd);
  padding:9px 14px;
  border-radius:4px;
}
.btn:hover{border-color:var(--gold)}
.primary{
  color:var(--gold);
  border-color:var(--gold);
  background:#2b2111;
}
.danger{color:var(--bad);border-color:#7a2a35}
input,select{
  width:100%;
  background:#090909;
  border:1px solid var(--bd);
  border-radius:4px;
  padding:11px;
  margin:5px 0 12px;
}
label{display:block;color:var(--mu);font-size:12px}
.login-box{
  width:100%;
  max-width:420px;
  padding:30px;
  border:1px solid var(--bd);
  background:#111112;
  text-align:center;
}
.login-box .logo{margin-bottom:20px}
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:90px 20px 30px;
}
#adminAccess{
  position:fixed;
  top:18px;
  right:20px;
  z-index:20;
}
#adminPanel{
  display:none;
  position:absolute;
  right:0;
  top:45px;
  width:290px;
  padding:18px;
  background:#111112;
  border:1px solid var(--gold);
}
#adminPanel.open{display:block}
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#171717;
  border:1px solid var(--gold);
  padding:12px 18px;
  display:none;
  z-index:30;
}
.error{color:var(--bad);font-size:13px;min-height:18px}
.switch{
  border:1px solid var(--bd);
  border-radius:20px;
  padding:7px 15px;
  background:#090909;
}
.switch.on{background:#392b13;color:var(--gold);border-color:var(--gold)}
.hidden{display:none!important}
body.admin-mode #app{display:block}
body.admin-mode nav{display:none}
body.admin-mode main{margin:auto}
@media(max-width:750px){
  #app{display:block}
  nav{
    min-height:0;
    height:auto;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    overflow-x:auto;
    padding:5px;
    border-top:1px solid var(--bd);
    border-right:0;
  }
  nav .logo{display:none}
  nav a{font-size:10px;text-align:center;min-width:75px;padding:9px 5px}
  main{padding:18px 14px 100px}
  body.admin-mode main{padding:25px 14px}
}
</style>
</head>

<body>

<div id="adminAccess">
  <button class="btn primary" id="adminToggle">ACCESO EXCLUSIVO</button>
  <div id="adminPanel">
    <h2>Administración ARGUSS</h2>
    <label>Correo administrador</label>
    <input id="adminEmail" type="email" placeholder="Correo administrador">
    <label>Contraseña</label>
    <input id="adminPassword" type="password" placeholder="Contraseña">
    <button class="btn primary" id="adminLogin" style="width:100%">Ingresar</button>
    <div class="error" id="adminError"></div>
  </div>
</div>

<div id="loginScreen">
  <div class="login-box">
    <div class="logo">ARGUSS<small>CASA INTELIGENTE</small></div>
    <h1>INICIAR SESIÓN</h1>
    <p class="sub">Ingresá con tu cuenta autorizada.</p>
    <label style="text-align:left">Correo electrónico</label>
    <input id="loginEmail" type="email" placeholder="usuario@correo.com">
    <label style="text-align:left">Contraseña</label>
    <input id="loginPassword" type="password" placeholder="Contraseña">
    <button class="btn primary" id="loginButton" style="width:100%">INGRESAR</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div id="app" class="hidden">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>
"use strict";

/* CONFIGURACIÓN */
const API = "https://domotica-nube-1.onrender.com";
const TOKEN_KEY = "arguss.token";

let currentUser = null;
let rooms = [];
let currentView = "inicio";
let adminUsers = [];
let historyData = [];
let climate = {
  mode:"auto",
  target:22,
  low:20,
  high:25,
  boiler:false,
  ac:false
};

const $ = id => document.getElementById(id);

function token(){
  return localStorage.getItem(TOKEN_KEY);
}

function saveToken(value){
  localStorage.setItem(TOKEN_KEY,value);
}

function clearToken(){
  localStorage.removeItem(TOKEN_KEY);
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function notify(message){
  $("toast").textContent = message;
  $("toast").style.display = "block";
  setTimeout(()=>$("toast").style.display="none",3000);
}

async function api(method,path,body){
  const response = await fetch(API+path,{
    method,
    headers:{
      "Content-Type":"application/json",
      ...(token()?{Authorization:"Bearer "+token()}:{})
    },
    body:body ? JSON.stringify(body) : undefined
  });

  let data={};
  try{data=await response.json()}catch(e){}

  if(!response.ok){
    throw new Error(data.error || data.message || "Error "+response.status);
  }

  return data;
}

/* AMBIENTES */
const roomDefinitions = [
  ["dormitorio-1","Dormitorio 1"],
  ["dormitorio-2","Dormitorio 2"],
  ["bano","Baño"],
  ["antebano","Antebaño"],
  ["cocina-comedor","Cocina-comedor"],
  ["sala-de-estar","Sala de estar"],
  ["balcon","Balcón"]
];

const lightsDefinitions = [
  ["luz-dorm1","dormitorio-1","Luz dormitorio 1"],
  ["luz-velador","dormitorio-1","Velador"],
  ["luz-dorm2","dormitorio-2","Luz dormitorio 2"],
  ["luz-bano","bano","Luz baño"],
  ["luz-antebano","antebano","Luz antebaño"],
  ["luz-cocina","cocina-comedor","Luz cocina"],
  ["luz-comedor","cocina-comedor","Luz comedor"],
  ["luz-estar","sala-de-estar","Luz sala de estar"],
  ["luz-balcon","balcon","Luz balcón"]
];

function defaultState(){
  return {schema:1,desired:{lights:{},climate:{}},reported:{}};
}

function getRoomState(room){
  let raw=room.state || {};
  if(typeof raw==="string"){
    try{raw=JSON.parse(raw)}catch(e){raw={}}
  }
  return raw.state || raw;
}

function getRoomKey(room){
  return room.roomKey || room.room_key || room.key || room.slug || room.id;
}

async function loadRooms(){
  const data=await api("GET","/api/rooms");
  const list=Array.isArray(data)?data:(data.rooms||[]);

  rooms=roomDefinitions.map(def=>{
    const found=list.find(x=>{
      const key=getRoomKey(x);
      return String(key)===def[0] ||
        String(x.name||x.label||"").toLowerCase()===def[1].toLowerCase();
    });

    const raw=found?getRoomState(found):defaultState();

    return {
      key:found?getRoomKey(found):def[0],
      id:def[0],
      name:def[1],
      state:raw,
      lights:lightsDefinitions
        .filter(l=>l[1]===def[0])
        .map(l=>({
          id:l[0],
          name:l[2],
          on:!!(raw.desired?.lights?.[l[0]]?.on)
        }))
    };
  });

  const central=rooms.find(r=>r.id==="sala-de-estar");
  if(central?.state?.desired?.climate){
    climate={...climate,...central.state.desired.climate};
  }
}

function roomPayload(room){
  const lights={};
  room.lights.forEach(l=>{
    lights[l.id]={name:l.name,on:l.on};
  });

  return {
    ...room.state,
    schema:1,
    desired:{
      ...(room.state.desired||{}),
      lights,
      ...(room.id==="sala-de-estar"?{climate:{...climate}}:{})
    },
    reported:room.state.reported||{}
  };
}

async function saveRoom(room){
  try{
    const payload=roomPayload(room);
    await api("PUT","/api/rooms/"+encodeURIComponent(room.key)+"/state",{
      state:payload
    });
    room.state=payload;
    notify("Cambio guardado en la nube.");
  }catch(error){
    notify("No se pudo guardar: "+error.message);
  }
}

/* AUTENTICACIÓN */
async function login(email,password,target){
  const data=await api("POST","/api/auth/login",{email,password});
  const tk=data.token||data.accessToken||data.jwt;

  if(!tk)throw new Error("El servidor no devolvió un token.");

  saveToken(tk);

  const me=await api("GET","/api/me");
  currentUser=me.user||me;

  const isAdmin=currentUser.role==="admin";

  if(target==="admin"&&!isAdmin){
    clearToken();
    currentUser=null;
    throw new Error("Esta cuenta no tiene permisos de administrador.");
  }

  if(target==="normal"&&isAdmin){
    clearToken();
    currentUser=null;
    throw new Error("Ingresá desde ACCESO EXCLUSIVO.");
  }

  if(isAdmin){
    document.body.classList.add("admin-mode");
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("adminAccess").classList.add("hidden");
    await loadAdminUsers();
    renderAdmin();
  }else{
    document.body.classList.remove("admin-mode");
    $("adminAccess").classList.remove("hidden");
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    await loadRooms();
    currentView="inicio";
    render();
  }
}

$("loginButton").addEventListener("click",async()=>{
  $("loginError").textContent="";
  try{
    await login($("loginEmail").value.trim(),$("loginPassword").value,"normal");
  }catch(e){
    $("loginError").textContent=e.message;
  }
});

$("adminToggle").addEventListener("click",()=>{
  $("adminPanel").classList.toggle("open");
});

$("adminLogin").addEventListener("click",async()=>{
  $("adminError").textContent="";
  try{
    await login($("adminEmail").value.trim(),$("adminPassword").value,"admin");
  }catch(e){
    $("adminError").textContent=e.message;
  }
});

/* ADMINISTRACIÓN EXCLUSIVA */
async function loadAdminUsers(){
  const data=await api("GET","/api/admin/users");
  adminUsers=Array.isArray(data)?data:(data.users||[]);
}

function renderAdmin(){
  document.body.classList.add("admin-mode");
  $("nav").innerHTML="";

  $("main").innerHTML=`
    <div style="max-width:950px;margin:35px auto">
      <div class="logo">ARGUSS<small>ADMINISTRACIÓN EXCLUSIVA</small></div>
      <h1>Usuarios y contraseñas</h1>
      <p class="sub">Administración de accesos de los tres departamentos.</p>

      <div class="card">
        <h2>Crear usuario</h2>

        <label>Correo electrónico</label>
        <input id="newEmail" type="email" placeholder="usuario@correo.com">

        <label>Contraseña inicial</label>
        <input id="newPassword" type="password" placeholder="Mínimo 8 caracteres">

        <label>Departamento</label>
        <select id="newDepartment">
          <option value="1">Departamento 1</option>
          <option value="2">Departamento 2</option>
          <option value="3">Departamento 3</option>
        </select>

        <button class="btn primary" id="createUser">CREAR USUARIO</button>
        <div class="error" id="createError"></div>
      </div>

      <h2>Usuarios registrados</h2>

      <div class="grid">
        ${adminUsers.map(user=>`
          <div class="card">
            <b>${escapeHTML(user.email)}</b>
            <p class="muted">Departamento ${escapeHTML(user.department)}</p>

            <label>Nueva contraseña</label>
            <input type="password" id="pass-${escapeHTML(user.id)}"
              placeholder="Nueva contraseña">

            <button class="btn" data-password="${escapeHTML(user.id)}">
              CAMBIAR CONTRASEÑA
            </button>

            <button class="btn danger" data-delete="${escapeHTML(user.id)}">
              ELIMINAR USUARIO
            </button>
          </div>
        `).join("")}
      </div>

      <div class="row">
        <button class="btn" id="reloadUsers">Actualizar lista</button>
        <button class="btn danger" id="adminLogout">Cerrar sesión</button>
      </div>
    </div>
  `;
}

$("main").addEventListener("click",async event=>{
  if(currentUser?.role!=="admin")return;

  if(event.target.id==="createUser"){
    const email=$("newEmail").value.trim();
    const password=$("newPassword").value;
    const department=Number($("newDepartment").value);

    if(!email||password.length<8){
      $("createError").textContent="Completá el correo y una contraseña de al menos 8 caracteres.";
      return;
    }

    try{
      await api("POST","/api/admin/users",{email,password,department});
      await loadAdminUsers();
      renderAdmin();
      notify("Usuario creado.");
    }catch(e){
      $("createError").textContent=e.message;
    }
  }

  if(event.target.id==="reloadUsers"){
    try{
      await loadAdminUsers();
      renderAdmin();
    }catch(e){notify(e.message)}
  }

  if(event.target.id==="adminLogout")logout();

  const passButton=event.target.closest("[data-password]");
  if(passButton){
    const id=passButton.dataset.password;
    const password=$("pass-"+id).value;

    if(password.length<8){
      notify("La contraseña debe tener al menos 8 caracteres.");
      return;
    }

    try{
      await api("POST",`/api/admin/users/${encodeURIComponent(id)}/password`,{password});
      notify("Contraseña actualizada.");
      await loadAdminUsers();
      renderAdmin();
    }catch(e){notify(e.message)}
  }

  const deleteButton=event.target.closest("[data-delete]");
  if(deleteButton){
    if(!confirm("¿Querés eliminar este usuario?"))return;

    try{
      await api("DELETE",`/api/admin/users/${encodeURIComponent(deleteButton.dataset.delete)}`);
      await loadAdminUsers();
      renderAdmin();
      notify("Usuario eliminado.");
    }catch(e){notify(e.message)}
  }
});

/* NAVEGACIÓN NORMAL */
const navItems=[
  ["inicio","Inicio"],
  ["ambientes","Ambientes"],
  ["luces","Iluminación"],
  ["clima","Climatización"],
  ["sensores","Sensores"],
  ["historial","Historial"],
  ["ajustes","Ajustes"]
];

function renderNav(){
  $("nav").innerHTML=`
    <div class="logo">ARGUSS<small>${escapeHTML(currentUser?.email||"")}</small></div>
    ${navItems.map(item=>`
      <a data-view="${item[0]}" class="${currentView===item[0]?"active":""}">
        ${item[1]}
      </a>
    `).join("")}
  `;
}

function header(title,description){
  return `<h1>${title}</h1><p class="sub">${description}</p>`;
}

function roomCard(room){
  return `
    <div class="card">
      <h2>${room.name}</h2>
      <p class="muted">${room.lights.filter(l=>l.on).length} luces encendidas por orden</p>
      <button class="btn" data-room="${room.id}">VER AMBIENTE</button>
    </div>
  `;
}

function lightControl(room,light){
  return `
    <div class="row">
      <span>${escapeHTML(light.name)}</span>
      <button class="switch ${light.on?"on":""}"
        data-light="${escapeHTML(light.id)}">
        ${light.on?"ENCENDIDA":"APAGADA"}
      </button>
    </div>
  `;
}

function render(){
  if(currentUser?.role==="admin"){
    renderAdmin();
    return;
  }

  renderNav();
  const main=$("main");

  if(currentView==="inicio"){
    main.innerHTML=header("ARGUSS","Tu casa, bajo control.")+
      `<div class="grid">${rooms.map(roomCard).join("")}</div>`;
  }

  if(currentView==="ambientes"){
    main.innerHTML=header("Ambientes","Tus siete ambientes.")+
      `<div class="grid">${rooms.map(roomCard).join("")}</div>`;
  }

  if(currentView==="luces"){
    main.innerHTML=header("Iluminación","Control de luces por ambiente.")+
      rooms.map(room=>`
        <h2>${room.name}</h2>
        <div class="card">
          ${room.lights.map(light=>lightControl(room,light)).join("")}
        </div>
      `).join("");
  }

  if(currentView.startsWith("room:")){
    const room=rooms.find(r=>r.id===currentView.split(":")[1]);
    if(!room){currentView="ambientes";render();return;}

    main.innerHTML=header(room.name,"Control del ambiente.")+
      `<div class="card">${room.lights.map(light=>lightControl(room,light)).join("")}</div>`;
  }

  if(currentView==="clima"){
    main.innerHTML=header("Climatización","Configuración de calderas y aires acondicionados.")+
      `<div class="grid">
        <div class="card">
          <h2>Temperatura objetivo</h2>
          <div class="row">
            <button class="btn" data-target="-0.5">−</button>
            <b>${climate.target} °C</b>
            <button class="btn" data-target="0.5">+</button>
          </div>
        </div>

        <div class="card">
          <h2>Calderas</h2>
          <button class="switch ${climate.boiler?"on":""}" data-climate="boiler">
            ${climate.boiler?"ORDEN: ENCENDER":"ORDEN: APAGAR"}
          </button>
        </div>

        <div class="card">
          <h2>Aires acondicionados</h2>
          <button class="switch ${climate.ac?"on":""}" data-climate="ac">
            ${climate.ac?"ORDEN: ENCENDER":"ORDEN: APAGAR"}
          </button>
        </div>

        <div class="card">
          <h2>Modo de control</h2>
          <select id="climateMode">
            <option value="auto" ${climate.mode==="auto"?"selected":""}>Automático</option>
            <option value="manual" ${climate.mode==="manual"?"selected":""}>Manual</option>
          </select>
          <label>Umbral caldera</label>
          <input id="lowTemp" type="number" value="${climate.low}">
          <label>Umbral aire acondicionado</label>
          <input id="highTemp" type="number" value="${climate.high}">
          <button class="btn primary" id="saveClimate">Guardar configuración</button>
        </div>
      </div>
      <p class="muted">Las órdenes se guardan en la nube. Todavía requieren la conexión y configuración del hardware para controlar equipos físicos.</p>`;
  }

  if(currentView==="sensores"){
    main.innerHTML=header("Sensores","Lecturas reportadas por los equipos.")+
      `<div class="card">
        <p class="muted">Todavía no hay lecturas físicas confirmadas. La ESP32 debe enviar los datos a la nube.</p>
        <p>Temperatura: —</p>
        <p>Humedad: —</p>
        <p>Oxígeno: —</p>
        <p>Luminosidad: —</p>
      </div>`;
  }

  if(currentView==="historial"){
    main.innerHTML=header("Historial","Cambios registrados en la nube.")+
      `<div class="card" id="historyContent">Cargando historial...</div>`;
    loadHistory();
  }

  if(currentView==="ajustes"){
    main.innerHTML=header("Ajustes","Tu cuenta.")+
      `<div class="card">
        <div class="row"><span>Usuario</span><b>${escapeHTML(currentUser?.email)}</b></div>
        <div class="row"><span>Departamento</span><b>${escapeHTML(currentUser?.department)}</b></div>
        <div class="row"><span>Servidor</span><span class="muted">ARGUSS Cloud</span></div>
        <button class="btn danger" id="logoutButton">Cerrar sesión</button>
      </div>`;
  }
}

async function persistClimate(){
  const room=rooms.find(r=>r.id==="sala-de-estar");
  if(!room)return;
  await saveRoom(room);
}

async function loadHistory(){
  try{
    const data=await api("GET","/api/history");
    historyData=Array.isArray(data)?data:(data.history||data.items||[]);
    const el=$("historyContent");
    if(el){
      el.innerHTML=historyData.length
        ?historyData.map(h=>`<div class="row">${escapeHTML(h.message||h.action||"Cambio registrado")}<span class="muted">${escapeHTML(h.created_at||"")}</span></div>`).join("")
        :"Todavía no hay cambios registrados.";
    }
  }catch(e){
    const el=$("historyContent");
    if(el)el.textContent=e.message;
  }
}

/* EVENTOS DE LA APLICACIÓN NORMAL */
$("nav").addEventListener("click",event=>{
  const link=event.target.closest("[data-view]");
  if(link){
    currentView=link.dataset.view;
    render();
  }
});

$("main").addEventListener("click",async event=>{
  if(currentUser?.role==="admin")return;

  const roomButton=event.target.closest("[data-room]");
  if(roomButton){
    currentView="room:"+roomButton.dataset.room;
    render();
    return;
  }

  const lightButton=event.target.closest("[data-light]");
  if(lightButton){
    const room=rooms.find(r=>r.lights.some(l=>l.id===lightButton.dataset.light));
    const light=room?.lights.find(l=>l.id===lightButton.dataset.light);
    if(light&&room){
      light.on=!light.on;
      render();
      await saveRoom(room);
    }
    return;
  }

  const climateButton=event.target.closest("[data-climate]");
  if(climateButton){
    const key=climateButton.dataset.climate;
    climate[key]=!climate[key];
    if(key==="boiler"&&climate.boiler)climate.ac=false;
    if(key==="ac"&&climate.ac)climate.boiler=false;
    render();
    await persistClimate();
    return;
  }

  const targetButton=event.target.closest("[data-target]");
  if(targetButton){
    climate.target=Math.max(16,Math.min(30,climate.target+Number(targetButton.dataset.target)));
    render();
    await persistClimate();
    return;
  }

  if(event.target.id==="saveClimate"){
    const low=Number($("lowTemp").value);
    const high=Number($("highTemp").value);

    if(low>=high){notify("El umbral de caldera debe ser menor que el del aire.");return;}

    climate.low=low;
    climate.high=high;
    climate.mode=$("climateMode").value;
    await persistClimate();
    render();
  }

  if(event.target.id==="logoutButton")logout();
});

function logout(){
  clearToken();
  currentUser=null;
  rooms=[];
  adminUsers=[];
  document.body.classList.remove("admin-mode");
  $("adminAccess").classList.remove("hidden");
  $("adminPanel").classList.remove("open");
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("loginEmail").value="";
  $("loginPassword").value="";
  $("adminEmail").value="";
  $("adminPassword").value="";
}

/* ARRANQUE */
async function boot(){
  if(!token())return;

  try{
    const me=await api("GET","/api/me");
    currentUser=me.user||me;

    if(currentUser.role==="admin"){
      $("loginScreen").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("adminAccess").classList.add("hidden");
      document.body.classList.add("admin-mode");
      await loadAdminUsers();
      renderAdmin();
    }else{
      $("loginScreen").classList.add("hidden");
      $("app").classList.remove("hidden");
      await loadRooms();
      render();
    }
  }catch(e){
    clearToken();
    currentUser=null;
  }
}

boot();
</script>
</body>
</html>

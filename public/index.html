<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUSS · Casa inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--s1:#111112;--s2:#17171a;--bd:#4d4025;--tx:#ece6d8;--mu:#8f887a;--gold:#cfa65e;--bad:#e5766c;--ok:#a9cf92;--wa:#e0b25a}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:300 15px/1.45 'Montserrat',Arial,sans-serif;min-height:100vh;background:linear-gradient(118deg,#0b0b0c 0 30%,#141415 30% 48%,#0c0c0d 48% 66%,#151516 100%) fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--bd);background:#0a0a0bd9;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.logo{color:var(--gold);font-size:20px;font-weight:300;letter-spacing:.4em;padding:4px 12px 18px}
.logo small{display:block;color:var(--mu);font-size:11px;letter-spacing:1px;font-weight:400;word-break:break-all}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:4px 0;border:1px solid transparent;color:var(--mu);cursor:pointer;border-radius:4px;text-decoration:none}
nav a:hover,nav a.active{color:var(--gold);border-color:var(--bd)}
main{padding:28px;width:100%;max-width:1200px}
h1{font-size:22px;font-weight:300;letter-spacing:.14em;margin:0 0 4px}
h2{font-size:14px;color:var(--gold);font-weight:400;letter-spacing:.12em;margin-top:26px}
.sub,.muted{color:var(--mu);font-size:13px}
.card{background:#111112d9;border:1px solid var(--bd);border-radius:4px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #4d402555}
.row:first-child{border-top:0}
.btn{background:transparent;border:1px solid var(--bd);padding:9px 14px;border-radius:4px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.primary{color:var(--gold);border-color:var(--gold);background:#2b2111}
.danger{color:var(--bad);border-color:#7a2a35}
input,select{width:100%;background:#090909;border:1px solid var(--bd);border-radius:4px;padding:11px;margin:5px 0 12px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--gold)}
label{display:block;color:var(--mu);font-size:12.5px}
.login-box{width:100%;max-width:420px;padding:30px;border:1px solid var(--bd);background:#111112d9;border-radius:4px;text-align:center;margin:auto}
.login-box .logo{margin-bottom:20px}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}
#adminAccess{position:fixed;top:18px;right:20px;z-index:20}
#adminPanel{display:none;position:absolute;right:0;top:45px;width:290px;padding:18px;background:#111112;border:1px solid var(--gold)}
#adminPanel.open{display:block}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#171717;border:1px solid var(--gold);padding:12px 18px;display:none;z-index:30;max-width:90vw}
.error{color:var(--bad);font-size:13px;min-height:18px}
.switch{border:1px solid var(--bd);border-radius:20px;padding:8px 18px;background:#090909;color:var(--mu);font-size:11px;font-weight:500;letter-spacing:1px;display:inline-flex;align-items:center;justify-content:center;transition:all .2s ease;white-space:nowrap}
.switch.on{background:#392b13;color:var(--gold);border-color:var(--gold)}
.hidden{display:none!important}
body.admin-mode #app{display:block}
body.admin-mode nav{display:none}
body.admin-mode main{margin:auto}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;margin:10px 0 20px}
.hl,.hr{text-align:center}
.clk{font-size:clamp(40px,7vw,64px);font-weight:200;letter-spacing:.14em}
.mic{position:relative;width:150px;height:150px;margin:15px auto;background:none;border:0;color:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center}
.mic svg.r{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--gold)}
.mic:hover{filter:drop-shadow(0 0 8px #cfa65e66)}
.dt{font-size:32px;font-weight:200;letter-spacing:.1em;margin-top:10px}
.dt small{display:block;font-size:11px;letter-spacing:.4em;color:var(--gold);margin-top:4px}
.hex{position:relative;width:min(260px,80%);margin:0 auto}
.hex svg{width:100%;display:block;fill:none;stroke:var(--gold);stroke-width:2}
.hex>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.chip{display:inline-flex;gap:7px;align-items:center;padding:5px 11px;border-radius:99px;border:1px solid var(--bd);background:#111112;font-size:12.5px}
.chip.ok{color:var(--ok);border-color:#526b43}
.chip.bad{color:var(--bad);border-color:#7a2a35}
.chip.wa{color:var(--wa);border-color:#80602a}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bad .dot{background:var(--bad)}
.wa .dot{background:var(--wa)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
@media(max-width:860px){
  .hero{grid-template-columns:1fr}
  #app{display:block}
  nav{height:auto;position:fixed;bottom:0;left:0;right:0;z-index:10;overflow-x:auto;padding:6px;border-top:1px solid var(--bd);border-right:0;flex-direction:row;justify-content:flex-start}
  nav .logo{display:none}
  nav a{font-size:10px;text-align:center;min-width:64px;padding:6px;flex-direction:column;gap:2px;margin:0}
  main{padding:60px 14px 100px}
  body.admin-mode main{padding:60px 14px 25px}
}
</style>
</head>
<body>

<div id="adminAccess">
  <button class="btn primary" id="adminToggle">ACCESO EXCLUSIVO</button>
  <div id="adminPanel">
    <h2 style="margin-top:0">Administración ARGUSS</h2>
    <label>Correo administrador</label>
    <input id="adminEmail" type="email" placeholder="Correo administrador" autocomplete="username">
    <label>Contraseña</label>
    <input id="adminPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn primary" id="adminLogin" style="width:100%">Ingresar</button>
    <div class="error" id="adminError"></div>
  </div>
</div>

<div id="loginScreen">
  <div class="login-box">
    <div class="logo">ARGUSS<small>CASA INTELIGENTE</small></div>
    <h1>INICIAR SESIÓN</h1>
    <p class="sub">Ingresá con tu cuenta autorizada.</p>
    <label style="text-align:left">Correo electrónico</label>
    <input id="loginEmail" type="email" placeholder="usuario@correo.com" autocomplete="username">
    <label style="text-align:left">Contraseña</label>
    <input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn primary" id="loginButton" style="width:100%">INGRESAR</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div id="app" class="hidden">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>
"use strict";

const API = "https://domotica-nube-1.onrender.com";
const TOKEN_KEY = "arguss.token";

let currentUser = null;
let rooms = [];
let currentView = "inicio";
let adminUsers = [];
let historyData = [];
let visitsLoading = false;
let toastTimer = null;
let climate = {mode:"auto", target:22, low:20, high:25, boiler:false, ac:false};

const $ = id => document.getElementById(id);
const isAdminUser = () => currentUser?.role === "admin";

/* ---------- Utilidades ---------- */
const token = () => localStorage.getItem(TOKEN_KEY);
const saveToken = v => localStorage.setItem(TOKEN_KEY, v);
const clearToken = () => localStorage.removeItem(TOKEN_KEY);

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function notify(message){
  const t = $("toast");
  t.textContent = message;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = "none", 3000);
}

async function withBusy(btn, fn){
  if(btn) btn.disabled = true;
  try{ return await fn(); }
  finally{ if(btn) btn.disabled = false; }
}

/* ---------- API ---------- */
async function api(method, path, body){
  let response;
  try{
    response = await fetch(API + path, {
      method,
      headers:{
        "Content-Type":"application/json",
        ...(token() ? {Authorization:"Bearer " + token()} : {})
      },
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
  }catch(e){
    throw new Error("No se pudo conectar con el servidor. Si recién arranca, esperá unos segundos y reintentá.");
  }

  let data = {};
  try{ data = await response.json(); }catch(e){}

  if(response.status === 401 && path !== "/api/auth/login" && token()){
    logout();
    $("loginError").textContent = "Tu sesión venció. Ingresá de nuevo.";
    throw new Error("Sesión vencida.");
  }
  if(!response.ok){
    const err = new Error(data.error || data.message || "Error " + response.status);
    err.status = response.status;
    throw err;
  }
  return data;
}

/* ---------- Definiciones ---------- */
const roomDefinitions = [
  ["dormitorio-1","Dormitorio 1"],
  ["dormitorio-2","Dormitorio 2"],
  ["bano","Baño"],
  ["antebano","Antebaño"],
  ["cocina-comedor","Cocina-comedor"],
  ["sala-de-estar","Sala de estar"],
  ["balcon","Balcón"]
];

const lightsDefinitions = [
  ["luz-dorm1","dormitorio-1","Luz dormitorio 1"],
  ["luz-velador","dormitorio-1","Velador"],
  ["luz-dorm2","dormitorio-2","Luz dormitorio 2"],
  ["luz-bano","bano","Luz baño"],
  ["luz-antebano","antebano","Luz antebaño"],
  ["luz-cocina","cocina-comedor","Luz cocina"],
  ["luz-comedor","cocina-comedor","Luz comedor"],
  ["luz-estar","sala-de-estar","Luz sala de estar"],
  ["luz-balcon","balcon","Luz balcón"]
];

const defaultState = () => ({schema:1, desired:{lights:{}, climate:{}}, reported:{}});

function getRoomState(room){
  let raw = room.state || {};
  if(typeof raw === "string"){
    try{ raw = JSON.parse(raw); }catch(e){ raw = {}; }
  }
  const s = raw.state || raw;
  return (s && typeof s === "object") ? s : defaultState();
}

const getRoomKey = room => room.roomKey || room.room_key || room.key || room.slug || room.id;

async function loadRooms(){
  const data = await api("GET", "/api/rooms");
  const list = Array.isArray(data) ? data : (data.rooms || []);

  rooms = roomDefinitions.map(def => {
    const found = list.find(x =>
      String(getRoomKey(x)) === def[0] ||
      String(x.name || x.label || "").toLowerCase() === def[1].toLowerCase());
    const raw = found ? getRoomState(found) : defaultState();
    return {
      key: found ? getRoomKey(found) : def[0],
      id: def[0],
      name: def[1],
      state: raw,
      lights: lightsDefinitions.filter(l => l[1] === def[0]).map(l => ({
        id: l[0], name: l[2], on: !!(raw.desired?.lights?.[l[0]]?.on)
      }))
    };
  });

  const central = rooms.find(r => r.id === "sala-de-estar");
  if(central?.state?.desired?.climate){
    climate = {...climate, ...central.state.desired.climate};
  }
  climate.target = Number(climate.target) || 22;
  climate.low = Number(climate.low) || 20;
  climate.high = Number(climate.high) || 25;
  climate.boiler = !!climate.boiler;
  climate.ac = !!climate.ac;
}

function roomPayload(room){
  const lights = {};
  room.lights.forEach(l => { lights[l.id] = {name:l.name, on:l.on}; });
  return {
    ...room.state,
    schema:1,
    desired:{
      ...(room.state.desired || {}),
      lights,
      ...(room.id === "sala-de-estar" ? {climate:{...climate}} : {})
    },
    reported: room.state.reported || {}
  };
}

async function saveRoom(room){
  try{
    const payload = roomPayload(room);
    await api("PUT", "/api/rooms/" + encodeURIComponent(room.key) + "/state", {state:payload});
    room.state = payload;
    notify("Cambio guardado en la nube.");
    return true;
  }catch(error){
    notify("No se pudo guardar: " + error.message);
    return false;
  }
}

async function persistClimate(){
  const room = rooms.find(r => r.id === "sala-de-estar");
  return room ? saveRoom(room) : false;
}

async function changeClimate(mutator){
  const prev = {...climate};
  mutator();
  render();
  if(!(await persistClimate())){
    climate = prev;
    render();
  }
}

/* ---------- Sesión ---------- */
async function startSession(){
  const admin = isAdminUser();
  document.body.classList.toggle("admin-mode", admin);
  if(admin){
    await loadAdminUsers();
  }else{
    await loadRooms();
    currentView = "inicio";
  }
  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("adminAccess").classList.add("hidden");
  render();
}

async function login(email, password, target){
  if(!email || !password) throw new Error("Completá el correo y la contraseña.");

  const data = await api("POST", "/api/auth/login", {email, password});
  const tk = data.token || data.accessToken || data.jwt;
  if(!tk) throw new Error("El servidor no devolvió un token.");
  saveToken(tk);

  try{
    const me = await api("GET", "/api/me");
    currentUser = me.user || me;
    const admin = isAdminUser();

    if(target === "admin" && !admin) throw new Error("Esta cuenta no tiene permisos de administrador.");
    if(target === "normal" && admin) throw new Error("Ingresá desde ACCESO EXCLUSIVO.");

    await startSession();
  }catch(e){
    clearToken();
    currentUser = null;
    throw e;
  }
}

function logout(){
  clearToken();
  currentUser = null;
  rooms = [];
  adminUsers = [];
  currentView = "inicio";
  document.body.classList.remove("admin-mode");
  $("adminAccess").classList.remove("hidden");
  $("adminPanel").classList.remove("open");
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  ["loginEmail","loginPassword","adminEmail","adminPassword"].forEach(id => $(id).value = "");
  ["loginError","adminError"].forEach(id => $(id).textContent = "");
}

async function boot(){
  if(!token()) return;
  try{
    const me = await api("GET", "/api/me");
    currentUser = me.user || me;
    await startSession();
  }catch(e){
    clearToken();
    currentUser = null;
  }
}

function bindLogin(btnId, emailId, passId, errId, target){
  const run = () => withBusy($(btnId), async () => {
    $(errId).textContent = "";
    try{
      await login($(emailId).value.trim(), $(passId).value, target);
    }catch(e){
      $(errId).textContent = e.message;
    }
  });
  $(btnId).addEventListener("click", run);
  [emailId, passId].forEach(id => $(id).addEventListener("keydown", e => { if(e.key === "Enter") run(); }));
}
bindLogin("loginButton","loginEmail","loginPassword","loginError","normal");
bindLogin("adminLogin","adminEmail","adminPassword","adminError","admin");
$("adminToggle").addEventListener("click", () => $("adminPanel").classList.toggle("open"));

/* ---------- Administración ---------- */
async function loadAdminUsers(){
  const data = await api("GET", "/api/admin/users");
  adminUsers = Array.isArray(data) ? data : (data.users || []);
}

function renderAdmin(){
  document.body.classList.add("admin-mode");
  $("nav").innerHTML = "";
  $("main").innerHTML = `
    <div style="max-width:950px;margin:35px auto">
      <div class="logo">ARGUSS<small>ADMINISTRACIÓN EXCLUSIVA</small></div>
      <h1>Usuarios y contraseñas</h1>
      <p class="sub">Administración de accesos de los departamentos.</p>

      <div class="card">
        <h2 style="margin-top:0">Crear usuario</h2>
        <label>Correo electrónico</label>
        <input id="newEmail" type="email" placeholder="usuario@correo.com">
        <label>Contraseña inicial</label>
        <input id="newPassword" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        <label>Departamento</label>
        <select id="newDepartment">
          <option value="1">Departamento 1</option>
          <option value="2">Departamento 2</option>
          <option value="3">Departamento 3</option>
        </select>
        <button class="btn primary" id="createUser">CREAR USUARIO</button>
        <div class="error" id="createError"></div>
      </div>

      <h2>Usuarios registrados</h2>
      <div class="grid">
        ${adminUsers.map(user => `
          <div class="card">
            <b>${escapeHTML(user.email)}</b>
            <p class="muted">Departamento ${escapeHTML(user.department)}</p>
            <label>Nueva contraseña</label>
            <input type="password" id="pass-${escapeHTML(user.id)}" placeholder="Nueva contraseña" autocomplete="new-password">
            <button class="btn" data-password="${escapeHTML(user.id)}">CAMBIAR CONTRASEÑA</button>
            <button class="btn danger" data-delete="${escapeHTML(user.id)}" style="margin-top:8px">ELIMINAR USUARIO</button>
          </div>`).join("") || `<div class="card muted">No hay usuarios registrados.</div>`}
      </div>

      <div class="row" style="margin-top:20px">
        <button class="btn" id="reloadUsers">Actualizar lista</button>
        <button class="btn danger" id="adminLogout">Cerrar sesión</button>
      </div>
    </div>`;
}

async function handleAdminClick(event){
  const t = event.target;

  if(t.id === "createUser"){
    const email = $("newEmail").value.trim();
    const password = $("newPassword").value;
    const department = Number($("newDepartment").value);
    if(!email || password.length < 8){
      $("createError").textContent = "Completá el correo y una contraseña de al menos 8 caracteres.";
      return;
    }
    await withBusy(t, async () => {
      try{
        await api("POST", "/api/admin/users", {email, password, department});
        await loadAdminUsers();
        renderAdmin();
        notify("Usuario creado.");
      }catch(e){ $("createError").textContent = e.message; }
    });
    return;
  }

  if(t.id === "reloadUsers"){
    try{ await loadAdminUsers(); renderAdmin(); }catch(e){ notify(e.message); }
    return;
  }

  if(t.id === "adminLogout"){ logout(); return; }

  const passButton = t.closest("[data-password]");
  if(passButton){
    const id = passButton.dataset.password;
    const password = $("pass-" + id).value;
    if(password.length < 8){ notify("La contraseña debe tener al menos 8 caracteres."); return; }
    await withBusy(passButton, async () => {
      try{
        await api("POST", `/api/admin/users/${encodeURIComponent(id)}/password`, {password});
        notify("Contraseña actualizada.");
        $("pass-" + id).value = "";
      }catch(e){ notify(e.message); }
    });
    return;
  }

  const deleteButton = t.closest("[data-delete]");
  if(deleteButton){
    if(!confirm("¿Querés eliminar este usuario?")) return;
    await withBusy(deleteButton, async () => {
      try{
        await api("DELETE", `/api/admin/users/${encodeURIComponent(deleteButton.dataset.delete)}`);
        await loadAdminUsers();
        renderAdmin();
        notify("Usuario eliminado.");
      }catch(e){ notify(e.message); }
    });
  }
}

/* ---------- Vistas de residente ---------- */
const navItems = [
  ["inicio","Inicio"],["ambientes","Ambientes"],["luces","Iluminación"],["clima","Climatización"],
  ["sensores","Sensores"],["seguridad","Seguridad"],["ingreso","Ingreso"],["historial","Historial"],["ajustes","Ajustes"]
];

function renderNav(){
  const active = currentView.startsWith("room:") ? "ambientes" : currentView;
  $("nav").innerHTML = `
    <div class="logo">ARGUSS<small>${escapeHTML(currentUser?.email || "")}</small></div>
    ${navItems.map(i => `<a data-view="${i[0]}" class="${active === i[0] ? "active" : ""}">${i[1]}</a>`).join("")}`;
}

const header = (title, description) => `
  <div class="top-bar">
    <div><h1>${title}</h1><p class="sub">${description}</p></div>
    <span class="chip bad"><i class="dot"></i>Sin respuesta del ESP32</span>
  </div>`;

const roomCard = room => `
  <div class="card">
    <h2 style="margin-top:0">${room.name}</h2>
    <p class="muted">${room.lights.filter(l => l.on).length} luces encendidas por orden</p>
    <button class="btn" data-room="${room.id}" style="margin-top:10px">VER AMBIENTE</button>
  </div>`;

const lightControl = (room, light) => `
  <div class="row">
    <span>${escapeHTML(light.name)}</span>
    <button class="switch ${light.on ? "on" : ""}" data-light="${escapeHTML(light.id)}">${light.on ? "ENCENDIDA" : "APAGADA"}</button>
  </div>`;

function dateParts(now = new Date()){
  const months = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  const days = ["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
  return {
    time: String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0"),
    date: String(now.getDate()).padStart(2,"0") + "-" + months[now.getMonth()],
    day: days[now.getDay()]
  };
}

function updateClock(){
  const clk = $("clk");
  if(!clk) return;
  const p = dateParts();
  clk.textContent = p.time;
  if($("dd")) $("dd").textContent = p.date;
  if($("dw")) $("dw").textContent = p.day;
}
setInterval(updateClock, 1000);

setInterval(() => {
  if(currentView === "ingreso" && currentUser && !isAdminUser()) loadVisits(true);
}, 15000);

function render(){
  if(!currentUser) return;
  if(isAdminUser()){ renderAdmin(); return; }

  renderNav();
  const main = $("main");
  const activeClimateText = climate.boiler ? "Caldera" : (climate.ac ? "Aire Acondicionado" : "En reposo");

  if(currentView === "inicio"){
    const totalLights = rooms.reduce((a, r) => a + r.lights.length, 0);
    const activeLights = rooms.reduce((a, r) => a + r.lights.filter(l => l.on).length, 0);
    const deptName = currentUser?.department ? `Departamento ${currentUser.department}` : (currentUser?.email || "Departamento");
    const p = dateParts();

    main.innerHTML = `
      ${header("ARGUSS · " + escapeHTML(deptName), "Tu casa, bajo control")}
      <div class="hero">
        <div class="hl">
          <div class="clk" id="clk">${p.time}</div>
          <button class="mic" id="micButton" aria-label="Orden de voz">
            <svg class="r" viewBox="0 0 170 170"><circle cx="85" cy="85" r="80" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/><circle cx="85" cy="85" r="68" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round" opacity=".6"/></svg>
            <svg style="width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.5" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v1a7 7 0 0 1-14 0v-1M12 18.5V22M8 22h8"/></svg>
          </button>
          <div class="muted" style="font-size:12px">Control por voz próximamente</div>
          <div class="dt"><span id="dd">${p.date}</span><small id="dw">${p.day}</small></div>
        </div>
        <div class="hr">
          <div class="hex">
            <svg viewBox="0 0 220 190"><polygon points="62,4 158,4 214,95 158,186 62,186 6,95"/></svg>
            <div>
              <span class="muted">Temperatura</span>
              <span style="font-size:36px;font-weight:300">—</span>
              <span style="color:var(--gold);font-size:13px">${escapeHTML(activeClimateText)}</span>
              <span class="muted" style="border-top:1px solid var(--bd);padding-top:6px;font-size:11px">Objetivo <span class="tgt-label">${climate.target}</span> °C</span>
            </div>
          </div>
          <div style="max-width:240px;margin:15px auto 0">
            <label style="font-size:11px">Objetivo <span class="tgt-label">${climate.target}</span> °C</label>
            <input type="range" id="targetRange" min="16" max="30" step="0.5" value="${climate.target}" style="margin:4px 0 0">
          </div>
        </div>
      </div>
      <div class="grid" style="margin-top:20px">
        <div class="card"><div class="muted">Temperatura general</div><div style="font-size:26px;font-weight:300;margin:6px 0">—</div><div class="muted">Sin sensores válidos</div></div>
        <div class="card"><div class="muted">Iluminación</div><div style="font-size:26px;font-weight:300;margin:6px 0">${activeLights}/${totalLights}</div><div class="muted">luces encendidas</div></div>
        <div class="card"><div class="muted">Climatización</div><div style="font-size:22px;font-weight:300;margin:6px 0">${escapeHTML(activeClimateText)}</div><div class="muted">${climate.mode === "auto" ? "Automático" : "Manual"} · objetivo ${climate.target} °C</div></div>
        <div class="card" data-view="seguridad" style="cursor:pointer"><div class="muted">Puertas y ventanas</div><div style="font-size:24px;font-weight:300;margin:6px 0;color:var(--mu)">Sin datos</div><div class="muted">Esperando sensores</div></div>
        <div class="card"><div class="muted">Ambientes</div><div style="font-size:26px;font-weight:300;margin:6px 0">${rooms.length}</div><div class="muted">0 dispositivos conectados de 21</div></div>
      </div>`;
    return;
  }

  if(currentView === "ambientes"){
    main.innerHTML = header("Ambientes","Tus siete ambientes.") + `<div class="grid">${rooms.map(roomCard).join("")}</div>`;
    return;
  }

  if(currentView === "luces"){
    main.innerHTML = header("Iluminación","Control de luces por ambiente.") +
      rooms.map(room => `<h2>${room.name}</h2><div class="card" style="margin-top:8px">${room.lights.map(l => lightControl(room, l)).join("")}</div>`).join("");
    return;
  }

  if(currentView.startsWith("room:")){
    const room = rooms.find(r => r.id === currentView.split(":")[1]);
    if(!room){ currentView = "ambientes"; render(); return; }
    main.innerHTML = header(room.name,"Control del ambiente.") +
      `<div class="card">${room.lights.map(l => lightControl(room, l)).join("")}</div>
       <button class="btn" data-view="ambientes" style="margin-top:15px">← VOLVER</button>`;
    return;
  }

  if(currentView === "clima"){
    main.innerHTML = header("Climatización","Configuración de calderas y aires acondicionados.") + `
      <div class="grid" style="margin-top:15px">
        <div class="card">
          <h2 style="margin-top:0">Temperatura objetivo</h2>
          <div class="row">
            <button class="btn" data-target="-0.5">−</button>
            <b>${climate.target} °C</b>
            <button class="btn" data-target="0.5">+</button>
          </div>
        </div>
        <div class="card">
          <h2 style="margin-top:0">Calderas</h2>
          <button class="switch ${climate.boiler ? "on" : ""}" data-climate="boiler" style="margin-top:10px">${climate.boiler ? "ENCENDIDA" : "APAGADA"}</button>
        </div>
        <div class="card">
          <h2 style="margin-top:0">Aires acondicionados</h2>
          <button class="switch ${climate.ac ? "on" : ""}" data-climate="ac" style="margin-top:10px">${climate.ac ? "ENCENDIDO" : "APAGADO"}</button>
        </div>
        <div class="card">
          <h2 style="margin-top:0">Modo de control</h2>
          <select id="climateMode">
            <option value="auto" ${climate.mode === "auto" ? "selected" : ""}>Automático</option>
            <option value="manual" ${climate.mode === "manual" ? "selected" : ""}>Manual</option>
          </select>
          <label>Umbral caldera (°C)</label>
          <input id="lowTemp" type="number" value="${climate.low}">
          <label>Umbral aire acondicionado (°C)</label>
          <input id="highTemp" type="number" value="${climate.high}">
          <button class="btn primary" id="saveClimate" style="width:100%;margin-top:10px">Guardar configuración</button>
        </div>
      </div>
      <p class="muted" style="margin-top:15px">Las órdenes se guardan en la nube. Requieren la conexión y configuración del hardware para controlar equipos físicos.</p>`;
    return;
  }

  if(currentView === "sensores"){
    main.innerHTML = header("Sensores","Lecturas reportadas por los equipos.") + `
      <div class="card" style="margin-top:15px">
        <p class="muted">Todavía no hay lecturas físicas confirmadas. La ESP32 debe enviar los datos a la nube.</p>
        <div class="row"><span>Temperatura</span><b>—</b></div>
        <div class="row"><span>Humedad</span><b>—</b></div>
        <div class="row"><span>Oxígeno</span><b>—</b></div>
        <div class="row"><span>Luminosidad</span><b>—</b></div>
      </div>`;
    return;
  }

  if(currentView === "seguridad"){
    main.innerHTML = header("Seguridad","Monitoreo de aberturas y detección de humo.") + `
      <div class="grid" style="margin-top:15px">
        <div class="card">
          <h2 style="margin-top:0">Detector de humo / gas</h2>
          <div class="row"><span>Estado del sensor</span><b style="color:var(--mu)">Sin datos</b></div>
          <p class="muted">Todavía no hay reportes del ESP32.</p>
        </div>
        <div class="card">
          <h2 style="margin-top:0">Puertas y ventanas</h2>
          <div class="row"><span>Estado general</span><b style="color:var(--mu)">Sin datos</b></div>
          <p class="muted">Todavía no hay sensores de apertura reportando.</p>
        </div>
      </div>
      <h2 style="margin-top:25px">Estado por ambiente</h2>
      <div class="grid">
        ${rooms.map(r => `<div class="card"><b>${r.name}</b><div class="row" style="margin-top:8px"><span class="muted">Puerta / Ventana</span><span style="color:var(--mu)">Sin datos</span></div></div>`).join("")}
      </div>`;
    return;
  }

  if(currentView === "ingreso"){
    main.innerHTML = header("Ingreso","Solicitudes de visita recibidas desde UniGuard.") + `
      <div class="top-bar" style="margin-top:15px">
        <div>
          <h2 style="margin:0">Solicitudes del tótem</h2>
          <p class="muted" style="margin:5px 0 0">Se muestran únicamente las visitas del departamento de tu cuenta.</p>
        </div>
        <button class="btn" id="reloadVisits">ACTUALIZAR</button>
      </div>
      <div id="visitsContent"><div class="card muted">Cargando solicitudes...</div></div>`;
    loadVisits();
    return;
  }

  if(currentView === "historial"){
    main.innerHTML = header("Historial","Cambios registrados en la nube.") +
      `<div class="card" style="margin-top:15px" id="historyContent">Cargando historial...</div>`;
    loadHistory();
    return;
  }

  if(currentView === "ajustes"){
    main.innerHTML = header("Ajustes","Tu cuenta y seguridad.") + `
      <div class="card" style="margin-top:15px">
        <div class="row"><span>Usuario</span><b>${escapeHTML(currentUser?.email)}</b></div>
        <div class="row"><span>Departamento</span><b>${escapeHTML(currentUser?.department || "—")}</b></div>
        <div class="row"><span>Servidor</span><span class="muted">ARGUSS Cloud</span></div>
        <div style="margin-top:20px"><button class="btn danger" id="logoutButton" style="width:100%">Cerrar sesión</button></div>
      </div>`;
    return;
  }

  currentView = "inicio";
  render();
}

/* ---------- Visitas (tótem) ---------- */
function visitStatus(v){
  if(v.status === "pending" && v.expires_at && new Date(v.expires_at).getTime() <= Date.now()) return "expired";
  return v.status || "pending";
}
const visitStatusLabel = s => ({pending:"Pendiente", accepted:"Aceptada", rejected:"Rechazada", expired:"Vencida"})[s] || s;

function formatVisitDate(value){
  if(!value) return "Fecha no disponible";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "Fecha no disponible";
  return d.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

async function loadVisits(silent = false){
  const container = $("visitsContent");
  if(!container || visitsLoading) return;
  visitsLoading = true;
  if(!silent) container.innerHTML = `<div class="card muted">Cargando solicitudes...</div>`;

  try{
    const data = await api("GET", "/api/visits");
    const visits = Array.isArray(data) ? data : (data.visits || data.items || []);
    const el = $("visitsContent");
    if(!el) return;

    if(!visits.length){
      el.innerHTML = `<div class="card"><h2 style="margin-top:0">No hay solicitudes</h2><p class="muted">Cuando alguien solicite ingresar desde el tótem, la visita aparecerá acá.</p></div>`;
      return;
    }

    el.innerHTML = visits.map(v => {
      const status = visitStatus(v);
      const pending = status === "pending";
      return `
        <div class="card" style="margin-bottom:12px">
          <div class="row" style="border:0;padding-top:0">
            <h2 style="margin:0">${escapeHTML(v.visitor_name || "Visitante sin nombre")}</h2>
            <span class="chip ${pending ? "wa" : (status === "accepted" ? "ok" : "bad")}">${escapeHTML(visitStatusLabel(status))}</span>
          </div>
          <div class="row"><span class="muted">Departamento</span><b>${escapeHTML(v.department ?? currentUser?.department ?? "—")}</b></div>
          <div class="row"><span class="muted">Motivo</span><span>${escapeHTML(v.visitor_reason || "No especificado")}</span></div>
          <div class="row"><span class="muted">Recibida</span><span>${escapeHTML(formatVisitDate(v.created_at))}</span></div>
          <div class="row"><span class="muted">Vence</span><span>${escapeHTML(formatVisitDate(v.expires_at))}</span></div>
          ${v.responded_at ? `<div class="row"><span class="muted">Respondida</span><span>${escapeHTML(formatVisitDate(v.responded_at))}</span></div>` : ""}
          ${pending ? `<div class="row" style="justify-content:flex-start;margin-top:6px">
            <button class="btn primary" data-visit-decision="accepted" data-visit-id="${escapeHTML(v.id)}">ACEPTAR</button>
            <button class="btn danger" data-visit-decision="rejected" data-visit-id="${escapeHTML(v.id)}">RECHAZAR</button>
          </div>` : ""}
        </div>`;
    }).join("");
  }catch(error){
    if(error.message === "Sesión vencida.") return;
    const el = $("visitsContent");
    if(el){
      const missing = error.status === 404;
      el.innerHTML = `
        <div class="card">
          <h2 style="margin-top:0">No se pudieron cargar las solicitudes</h2>
          <p class="error">${escapeHTML(error.message)}</p>
          <p class="muted">${missing
            ? "El servidor todavía no tiene la ruta /api/visits. Hay que agregarla en el backend."
            : "Verificá tu sesión y que el servidor ARGUSS esté disponible."}</p>
          <button class="btn" id="reloadVisits">REINTENTAR</button>
        </div>`;
    }
  }finally{
    visitsLoading = false;
  }
}

async function respondVisit(btn){
  const id = btn.dataset.visitId;
  const decision = btn.dataset.visitDecision;
  if(!id || !["accepted","rejected"].includes(decision)) return;
  if(!confirm(`¿Confirmás ${decision === "accepted" ? "aceptar" : "rechazar"} esta solicitud de visita?`)) return;

  await withBusy(btn, async () => {
    try{
      await api("PATCH", `/api/visits/${encodeURIComponent(id)}/respond`, {decision});
      notify(decision === "accepted" ? "Visita aceptada." : "Visita rechazada.");
    }catch(error){
      notify("No se pudo responder: " + error.message);
    }
  });
  visitsLoading = false;
  await loadVisits();
}

/* ---------- Historial ---------- */
async function loadHistory(){
  try{
    const data = await api("GET", "/api/history");
    historyData = Array.isArray(data) ? data : (data.history || data.items || []);
    const el = $("historyContent");
    if(el){
      el.innerHTML = historyData.length
        ? historyData.map(h => `<div class="row"><span>${escapeHTML(h.message || h.action || "Cambio registrado")}</span><span class="muted">${escapeHTML(h.created_at ? formatVisitDate(h.created_at) : "")}</span></div>`).join("")
        : "Todavía no hay cambios registrados.";
    }
  }catch(e){
    const el = $("historyContent");
    if(el) el.textContent = e.message;
  }
}

/* ---------- Eventos ---------- */
$("nav").addEventListener("click", event => {
  const link = event.target.closest("[data-view]");
  if(link){ currentView = link.dataset.view; render(); }
});

// Slider de temperatura: actualiza etiquetas al mover y guarda una sola vez al soltar
$("main").addEventListener("input", event => {
  if(event.target.id !== "targetRange") return;
  climate.target = Number(event.target.value);
  document.querySelectorAll(".tgt-label").forEach(el => el.textContent = climate.target);
});
$("main").addEventListener("change", async event => {
  if(event.target.id !== "targetRange") return;
  const prev = climate.target;
  if(!(await persistClimate())){ climate.target = prev; render(); }
});

$("main").addEventListener("click", async event => {
  if(isAdminUser()){ await handleAdminClick(event); return; }
  const t = event.target;

  if(t.closest("#micButton")){ notify("El control por voz todavía no está disponible."); return; }
  if(t.id === "reloadVisits"){ visitsLoading = false; await loadVisits(); return; }

  const decisionBtn = t.closest("[data-visit-decision]");
  if(decisionBtn){ await respondVisit(decisionBtn); return; }

  const viewLink = t.closest("[data-view]");
  if(viewLink){ currentView = viewLink.dataset.view; render(); return; }

  const roomButton = t.closest("[data-room]");
  if(roomButton){ currentView = "room:" + roomButton.dataset.room; render(); return; }

  const lightButton = t.closest("[data-light]");
  if(lightButton){
    const id = lightButton.dataset.light;
    const room = rooms.find(r => r.lights.some(l => l.id === id));
    const light = room?.lights.find(l => l.id === id);
    if(light && room){
      light.on = !light.on;
      render();
      if(!(await saveRoom(room))){ light.on = !light.on; render(); }
    }
    return;
  }

  const climateButton = t.closest("[data-climate]");
  if(climateButton){
    const key = climateButton.dataset.climate;
    await changeClimate(() => {
      climate[key] = !climate[key];
      if(key === "boiler" && climate.boiler) climate.ac = false;
      if(key === "ac" && climate.ac) climate.boiler = false;
    });
    return;
  }

  const targetButton = t.closest("[data-target]");
  if(targetButton){
    await changeClimate(() => {
      climate.target = Math.max(16, Math.min(30, Number(climate.target) + Number(targetButton.dataset.target)));
    });
    return;
  }

  if(t.id === "saveClimate"){
    const low = Number($("lowTemp").value);
    const high = Number($("highTemp").value);
    if(Number.isNaN(low) || Number.isNaN(high)){ notify("Ingresá umbrales válidos."); return; }
    if(low >= high){ notify("El umbral de caldera debe ser menor que el del aire."); return; }
    await changeClimate(() => {
      climate.low = low;
      climate.high = high;
      climate.mode = $("climateMode").value;
    });
    return;
  }

  if(t.id === "logoutButton") logout();
});

boot();
</script>
</body>

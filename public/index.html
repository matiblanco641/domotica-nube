<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plan .card{padding:10px;text-align:center}.plan b{display:block}
.pulse{animation:p 2s infinite}@keyframes p{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input[type=range]{padding:0;border:0;background:none;-webkit-appearance:none;height:24px}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--cy)}input[type=range]::-moz-range-track{height:2px;background:var(--cy)}

.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;margin:10px 0 6px}.hl,.hr{text-align:center}
.clk{font-size:clamp(40px,8vw,66px);font-weight:200;letter-spacing:.14em}
.mic{position:relative;width:170px;height:170px;margin:10px auto;background:none;border:0;color:var(--cy);cursor:pointer;border-radius:50%}
.mic svg.r{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--cy)}.mic .ic{width:52px;height:52px;position:absolute;left:59px;top:59px}
.dt{font-size:40px;font-weight:200;letter-spacing:.1em;margin-top:8px}.dt small{display:block;font-size:12px;letter-spacing:.5em;color:var(--cy);margin-top:4px}
.hex{position:relative;width:min(270px,75%);margin:0 auto}.hex svg{width:100%;display:block;fill:none;stroke:var(--cy);stroke-width:2}
.hex div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.login-box{max-width:420px;margin:60px auto;padding:28px 24px;border:1px solid var(--bd);background:#111112d9;border-radius:4px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:92vw;background:#17171a;border:1px solid var(--cy);border-radius:4px;padding:10px 16px;z-index:9;font-size:13px;display:none}#toast.bad{border-color:var(--bad);color:var(--bad)}
@media(max-width:860px){#app{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:#050505f2;backdrop-filter:blur(10px);border-top:1px solid var(--bd);border-right:0;z-index:5;justify-content:space-around}
.logo{display:none}nav a{flex-direction:column;gap:1px;padding:5px 3px;font-size:10px;flex:1;text-align:center;min-width:0}main{padding-bottom:100px}.grid{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="toast" role="status"></div>
<script>
"use strict";

/* ===== DATOS BASE ===== */

 ic=k=>`<svg class="ic" viewBox="0 0 24 24"><path d="${P[k]||P.door}"/></svg>`;
const R0=[['dormitorio-1','Dormitorio 1','bed'],['dormitorio-2','Dormitorio 2','bed'],['bano','Baño','shower'],['antebano','Antebaño','sink'],['cocina-comedor','Cocina-comedor','sofa'],['sala-de-estar','Sala de estar','sofa'],['balcon','Balcón','balcony']],
 L0=[['luz-dorm1','dormitorio-1','Luz techo'],['luz-velador','dormitorio-1','Velador'],['luz-dorm2','dormitorio-2','Luz techo'],['luz-bano','bano','Luz baño'],['luz-antebano','antebano','Luz espejo'],['luz-cocina','cocina-comedor','Luz cocina'],['luz-comedor','cocina-comedor','Luz comedor'],['luz-estar','sala-de-estar','Luz estar'],['luz-balcon','balcon','Luz balcón']],
 S0=[['temp-estar','sala-de-estar','temp','Temp. sala de estar'],['temp-dorm1','dormitorio-1','temp','Temp. dormitorio 1'],['temp-dorm2','dormitorio-2','temp','Temp. dormitorio 2'],['hum-estar','sala-de-estar','hum','Humedad sala de estar'],['hum-bano','bano','hum','Humedad baño'],['o2-estar','sala-de-estar','o2','Oxígeno sala de estar'],['lux-estar','sala-de-estar','lux','Luz ambiente'],['door-principal','sala-de-estar','door','Puerta principal'],['door-balcon','balcon','door','Puerta balcón'],['win-dorm1','dormitorio-1','window','Ventana dormitorio 1'],['win-dorm2','dormitorio-2','window','Ventana dormitorio 2'],['mov-estar','sala-de-estar','motion','Movimiento sala'],['air-estar','cocina-comedor','air','Aire cocina-comedor']].map(a=>({id:a[0],room:a[1],kind:a[2],name:a[3]})),
 KINDS={temp:['Temperatura','°C'],hum:['Humedad','%'],o2:['Oxígeno (O₂)','%'],lux:['Luminosidad','lx'],door:['Puerta',''],window:['Ventana',''],motion:['Movimiento',''],air:['Calidad del aire','ICA']},
 CLK='sala-de-estar',CL0={mode:'auto',target:22,low:20,high:25,boiler:false,ac:false};
/* ===== ESTADO ===== */
let U=null,rooms=[],CLM={...CL0},hist=null,net='idle',phase='boot',authMode='login',bootErr='',busyAuth=false,lastOk=null,filt='',inflight={};
const $=i=>document.getElementById(i),token=()=>{try{return localStorage.getItem(TK)}catch(e){return null}},
 setTok=t=>{try{t?localStorage.setItem(TK,t):localStorage.removeItem(TK)}catch(e){}},
 esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
 norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''),
 fmt=t=>{const d=new Date(t);return t&&!isNaN(d)?d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'};
let tt;function toast(m,bad){const e=$('toast');e.textContent=m;e.className=bad?'bad':'';e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',bad?6000:2500)}
/* ===== API ===== */
async function api(method,path,body){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),45000),w=setTimeout(()=>{if(net!=='ok'){net='waking';render(1)}},4000),tk=token();
 try{
  const r=await fetch(API+path,{method,signal:c.signal,headers:{'Content-Type':'application/json',...(tk?{Authorization:'Bearer '+tk}:{})},body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const m=(d&&(d.error||d.message))||('Error '+r.status);
   if(r.status===401&&!path.startsWith('/api/auth/')){net='ok';logout('Tu sesión venció. Iniciá sesión de nuevo.')}
   const e=new Error(typeof m==='string'?m:'Error '+r.status);e.status=r.status;throw e}
  net='ok';lastOk=Date.now();return d||{};
 }catch(e){
  if(e.status)throw e;net='error';
  throw new Error(e.name==='AbortError'?'El servidor tardó demasiado en responder.':'No se pudo conectar con el servidor (revisá tu conexión).');
 }finally{clearTimeout(t);clearTimeout(w)}}
function once(k,fn){return inflight[k]||(inflight[k]=fn().finally(()=>{delete inflight[k]}))}
/* ===== MODELO DE HABITACIONES ===== */
function hydrate(r,raw){
 if(typeof raw==='string'){try{raw=JSON.parse(raw)}catch(e){raw={}}}
 raw=raw&&typeof raw==='object'?raw:{};
 if(raw.state&&typeof raw.state==='object'&&!raw.desired)raw=raw.state;
 const dl=(raw.desired&&raw.desired.lights)||{};
 r.raw=raw;r.rep=raw.reported&&typeof raw.reported==='object'?raw.reported:{};
 r.lights=L0.filter(l=>l[1]===r.def).map(l=>({id:l[0],name:(dl[l[0]]&&dl[l[0]].name)||l[2],on:!!(dl[l[0]]&&dl[l[0]].on)}));
 if(r.def===CLK)CLM={...CL0,...((raw.desired&&raw.desired.climate)||{})};
 r.saved=JSON.stringify(payload(r))}
function payload(r){const l={};r.lights.forEach(d=>l[d.id]={name:d.name,on:d.on});
 const des={lights:l};if(r.def===CLK)des.climate={...CLM};
 return {...r.raw,schema:1,desired:des,reported:r.rep}}
async function loadRooms(){return once('rooms',async()=>{
 const d=await api('GET','/api/rooms'),list=Array.isArray(d)?d:(d.rooms||[]),used=new Set(),out=[];
 const rs=x=>x.state||x.estado||x.state_json||x.data||x.states||{};
 R0.forEach(a=>{const f=list.find(x=>norm(x.roomKey||x.room_key||x.key||x.slug||x.id)===norm(a[0])||norm(x.name||x.label||x.nombre)===norm(a[1]));
  if(f)used.add(f);const r={def:a[0],key:f?(f.roomKey||f.room_key||f.key||f.slug||f.id):a[0],name:a[1],icon:a[2],inCloud:!!f};hydrate(r,f?rs(f):{});out.push(r)});
 list.filter(x=>!used.has(x)).forEach(x=>{const k=x.roomKey||x.room_key||x.key||x.slug||x.id;if(k==null)return;const r={def:'x-'+k,key:k,name:x.name||x.label||String(k),icon:'door',inCloud:true};hydrate(r,rs(x));out.push(r)});
 rooms=out})}
async function save(r){
 if(r.sv){r.again=1;return}r.sv=1;
 try{do{r.again=0;const b=payload(r);await api('PUT','/api/rooms/'+encodeURIComponent(r.key)+'/state',WRAP?{[WRAP]:b}:b);r.saved=JSON.stringify(b);r.inCloud=true}while(r.again);
  toast('Guardado en la nube')}
 catch(e){hydrate(r,JSON.parse(r.saved));toast('No se guardó el cambio: '+e.message,1)}
 finally{r.sv=0;render(1)}}
const roomOf=id=>rooms.find(r=>r.lights.some(d=>d.id===id)),rdef=d=>rooms.find(r=>r.def===d),climR=()=>rdef(CLK);
function setLight(d,on){d.on=on;render(1);save(roomOf(d.id))}
let ct;function setClim(p){Object.assign(CLM,p);if(p.boiler)CLM.ac=false;if(p.ac)CLM.boiler=false;render(1);clearTimeout(ct);ct=setTimeout(()=>climR()&&save(climR()),400)}
/* Estado físico: solo existe si el ESP32 lo reportó (state.reported). Hoy no hay ESP32. */
function phys(r,d){const x=r.rep.lights&&r.rep.lights[d.id];return x&&x.ts?(x.on===d.on?['ok','Confirmado por el equipo']:['wa','Pendiente de confirmación del equipo']):['','Sin confirmar · ESP32 no conectada']}
function sval(s){const r=rdef(s.room),x=r&&r.rep.sensors&&r.rep.sensors[s.id];return x&&x.value!=null?x:null}
const avgTemp=()=>{const a=S0.filter(s=>s.kind==='temp').map(sval).filter(Boolean);return a.length?a.reduce((x,s)=>x+ +s.value,0)/a.length:null};
const sText=s=>{const x=sval(s);return !x?'Sin lectura':['door','window'].includes(s.kind)?(x.value?'Abierta':'Cerrada'):s.kind==='motion'?(x.value?'Detectado':'Sin movimiento'):x.value+' '+KINDS[s.kind][1]};
const allL=()=>rooms.flatMap(r=>r.lights);
/* ===== HISTORIAL ===== */
async function loadHist(){return once('hist',async()=>{try{const d=await api('GET','/api/history');hist=Array.isArray(d)?d:(d.history||d.items||d.rows||[])}catch(e){hist=hist||[];toast('Historial: '+e.message,1)}render(1)})}
function hRow(h){const t=h.created_at||h.createdAt||h.timestamp||h.ts||h.time,rk=h.room_key||h.roomKey||h.room,rr=rooms.find(r=>String(r.key)===String(rk)),
 det=h.details||h.changes||h.new_state||h.newState||h.state||h.payload,m=h.message||h.description||h.action||h.event||'Cambio guardado';
 const ds=det==null?'':typeof det==='string'?det:JSON.stringify(det);
 return `<div class="ev"><span>•</span><div>${esc(m)}${ds?`<div class="mu">${esc(ds.length>160?ds.slice(0,160)+'…':ds)}</div>`:''}<div class="mu">${esc(rr?rr.name:(rk||'—'))} · ${fmt(t)}</div></div><span class="tag sim">orden guardada</span></div>`}
/* ===== VISTAS ===== */
const NAV=[['dash','Inicio','home'],['rooms','Ambientes','grid'],['light','Luces','bulb'],['clima','Clima','therm'],['sens','Sensores','sens'],['seg','Historial','shield'],['cfg','Ajustes','gear']];
function chips(){const m={idle:['wa','Nube: sin conectar'],waking:['wa','Nube: despertando servidor…'],ok:['ok','Nube conectada'],error:['bad','Nube: sin respuesta']}[net];
 return `<span class="chip ${m[0]}"><i class="dot ${net==='ok'?'pulse':''}"></i>${m[1]}</span><span class="chip wa"><i class="dot"></i>ESP32: no conectada</span>`}
const head=(t,s)=>`<div class="top"><div><h1>${t}</h1><p class="sub">${s||''}</p></div><div>${chips()}</div></div><div class="demo">Los estados son órdenes guardadas en la nube. Ningún equipo físico confirmó su funcionamiento (ESP32 aún no conectada).</div>`;
function lightRow(d){const r=roomOf(d.id),p=phys(r,d);return `<div class="row"><div>${esc(d.name)}<div class="mu">Orden: ${d.on?'encender':'apagar'} <span class="tag ${p[0]==='ok'?'real':'sim'}">${p[1]}</span></div></div><button class="sw ${d.on?'on':''}" role="switch" aria-checked="${d.on}" aria-label="${esc(d.name)}" data-act="tog" data-id="${esc(d.id)}" ${r.sv?'disabled':''}></button></div>`}
function rmCard(r){const on=r.lights.filter(d=>d.on).length,t=S0.find(s=>s.room===r.def&&s.kind==='temp'),h=S0.find(s=>s.room===r.def&&s.kind==='hum'),tv=t&&sval(t),hv=h&&sval(h);
 return `<div class="card click" data-go="room-${esc(r.def)}" tabindex="0"><div class="top"><span style="font-size:26px">${ic(r.icon)}</span></div><b>${esc(r.name)}</b><div class="mu">${tv?tv.value+' °C':'— °C'} · ${hv?hv.value+' %':'— %'}</div><div class="mu">${ic('bulb')} ${on}/${r.lights.length} con orden de encender</div></div>`}
function hero(){const t=avgTemp(),hv=CLM.boiler?ic('flame')+' Caldera (orden)':CLM.ac?ic('snow')+' Aire (orden)':'Climatización sin órdenes';
 return `<div class="hero"><div class="hl"><div class="clk" id="clk"></div><button class="mic" data-act="voice" aria-label="Comandos de voz"><svg class="r" viewBox="0 0 170 170"><circle cx="85" cy="85" r="80" stroke-width="3" stroke-dasharray="1 6" stroke-linecap="round"/><circle cx="85" cy="85" r="66" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity=".6"/></svg>${ic('mic')}</button><div class="mu" id="vmsg">Tocá el micrófono y decí: “prendé la luz del dormitorio 1”</div><div class="dt"><span id="dd"></span><small id="dw"></small></div></div><div class="hr"><div class="hex"><svg viewBox="0 0 220 190"><polygon points="62,4 158,4 214,95 158,186 62,186 6,95"/></svg><div><span class="mu">Temperatura medida</span><span class="big" style="font-size:38px">${t==null?'—':t.toFixed(1)+'°'}</span><span class="mu">${hv}</span></div></div><div style="max-width:280px;margin:16px auto 0"><div class="mu">Objetivo ${CLM.target} °C</div><input type="range" id="tg" min="16" max="30" step="0.5" value="${CLM.target}" aria-label="Temperatura objetivo"></div></div></div>`}
const V={
dash(){const t=avgTemp(),L=allL(),on=L.filter(d=>d.on);
 return head('ARGUSS','Tu casa, bajo control')+hero()+`<div class="grid">
 <div class="card"><div class="mu">Temperatura general</div><div class="big">${t==null?'—':t.toFixed(1)+' °C'}</div><div class="mu">${t==null?'Sin lecturas de sensores':'Promedio de sensores con lectura'}</div></div>
 <div class="card"><div class="mu">Iluminación (órdenes)</div><div class="big">${on.length}/${L.length}</div><div class="mu">con orden de encender</div></div>
 <div class="card"><div class="mu">Climatización</div><div class="big">${CLM.boiler?'Caldera':CLM.ac?'Aire':'En reposo'}</div><div class="mu">Modo ${CLM.mode==='auto'?'automático':'manual'} · objetivo ${CLM.target} °C</div></div>
 <div class="card"><div class="mu">Ambientes</div><div class="big">${rooms.length}</div><div class="mu">${S0.filter(sval).length} de ${S0.length} sensores con lectura</div></div></div>
 <h2>Ambientes</h2><div class="grid">${rooms.map(rmCard).join('')}</div>
 <h2>Plano esquemático</h2><div class="plan">${rooms.map(r=>{const o=r.lights.some(d=>d.on);return `<div class="card click" data-go="room-${esc(r.def)}" style="${o?'border-color:var(--cy)':''}">${ic(r.icon)}<b>${esc(r.name)}</b><span class="mu">${o?'orden: luz encendida':'orden: luz apagada'}</span></div>`}).join('')}</div>`},
rooms(){return head('Ambientes','Tocá un ambiente para ver su detalle.')+`<div class="grid">${rooms.map(rmCard).join('')}</div>`},
room(id){const r=rdef(id);if(!r)return head('Ambiente no encontrado','')+'<button class="btn" data-go="rooms">Volver</button>';
 return `<button class="btn" data-go="rooms">← Ambientes</button>`+head(ic(r.icon)+' '+esc(r.name),r.inCloud?'Guardado en tu cuenta.':'Aún sin datos en la nube: se creará al guardar el primer cambio.')+
 `<h2>Luces</h2><div class="card">${r.lights.map(lightRow).join('')||'<div class="mu">Sin luces asignadas.</div>'}</div><h2>Sensores</h2><div class="card">${S0.filter(s=>s.room===r.def).map(s=>`<div class="row"><span>${esc(s.name)}<div class="mu">${KINDS[s.kind][0]}</div></div><b>${sText(s)}</b></div>`).join('')||'<div class="mu">Sin sensores.</div>'}</div>`},
light(){return head('Iluminación','Luces agrupadas por ambiente.')+`<div class="bar"><button class="btn p" data-act="all" data-v="1">Ordenar encender todas</button><button class="btn" data-act="all" data-v="0">Ordenar apagar todas</button></div>`+rooms.map(r=>r.lights.length?`<h2>${ic(r.icon)} ${esc(r.name)}</h2><div class="card">${r.lights.map(lightRow).join('')}</div>`:'').join('')},
clima(){const t=avgTemp(),A=CLM.mode==='auto';
 return head('Climatización','Control de calderas y aire acondicionado.')+(t==null?'<div class="card wa" style="margin-bottom:10px">Sin lecturas de temperatura: no hay sensores reportando. El modo automático no puede decidir hasta que el termostato/ESP32 esté conectado.</div>':'')+
 `<div class="grid"><div class="card"><div class="mu">Temperatura medida</div><div class="big">${t==null?'—':t.toFixed(1)+' °C'}</div></div>
 <div class="card"><div class="mu">Temperatura objetivo (guardada)</div><div class="bar" style="align-items:center"><button class="btn" data-act="tgt" data-v="-0.5">−</button><span class="big">${CLM.target} °C</span><button class="btn" data-act="tgt" data-v="0.5">+</button></div></div>
 <div class="card"><div class="mu">Órdenes guardadas · equipo sin confirmar</div>
 <div class="row"><span>${ic('flame')} Calderas</span><button class="btn ${CLM.boiler?'on':''}" data-act="boiler" ${A?'disabled':''}>${CLM.boiler?'ORDEN: ENCENDER':'ORDEN: APAGAR'}</button></div>
 <div class="row"><span>${ic('snow')} Aire acondicionado</span><button class="btn ${CLM.ac?'on':''}" data-act="ac" ${A?'disabled':''}>${CLM.ac?'ORDEN: ENCENDER':'ORDEN: APAGAR'}</button></div></div></div>
 <h2>Modo de control</h2><div class="bar"><button class="btn ${A?'on':''}" data-act="mode" data-v="auto">Automático</button><button class="btn ${A?'':'on'}" data-act="mode" data-v="manual">Manual</button></div>
 <div class="mu">${A?`Automático: el termostato decidirá con los umbrales (${CLM.low} °C / ${CLM.high} °C). Hoy solo se guarda la configuración; no hay termostato conectado.`:'Manual: podés guardar órdenes para caldera y aire con los botones.'}</div>
 <h2>Umbrales automáticos</h2><div class="card"><label class="lbl">Caldera por debajo de (°C)</label><input type="number" step="0.5" id="th-low" value="${CLM.low}"><label class="lbl">Aire acondicionado desde (°C)</label><input type="number" step="0.5" id="th-high" value="${CLM.high}"><div class="bar"><button class="btn p" data-act="th">Guardar umbrales</button></div><div class="err" id="th-err"></div></div>`},
sens(){const g={};S0.forEach(s=>(g[s.kind]=g[s.kind]||[]).push(s));
 return head('Sensores','Última lectura reportada por el equipo.')+Object.keys(KINDS).map(k=>`<h2>${KINDS[k][0]}</h2><div class="card">${g[k].map(s=>{const x=sval(s),r=rdef(s.room);return `<div class="row"><div>${esc(s.name)}<div class="mu">${esc(r?r.name:'')} · ${x?fmt(x.ts):'sin conexión'}</div></div><b>${sText(s)}</b></div>`}).join('')}</div>`).join('')+'<div class="mu" style="margin-top:12px">Sin lecturas hasta conectar la ESP32. No se muestran valores inventados.</div>'},
seg(){const E=(hist||[]).filter(h=>!filt||String(h.room_key||h.roomKey||h.room)===filt);
 return head('Historial','Cambios guardados en tu cuenta (GET /api/history).')+`<div class="bar"><select id="f-room" style="max-width:260px"><option value="">Todos los ambientes</option>${rooms.map(r=>`<option value="${esc(r.key)}" ${String(filt)===String(r.key)?'selected':''}>${esc(r.name)}</option>`).join('')}</select><button class="btn" data-act="hist">Actualizar</button></div><div class="card">${hist===null?'<div class="mu">Cargando…</div>':E.length?E.map(hRow).join(''):'<div class="mu">Todavía no hay cambios guardados.</div>'}</div>`},
cfg(){return head('Ajustes','Cuenta y conexión.')+`<h2>Sesión</h2><div class="card"><div class="row"><span>Usuario</span><b>${esc(U&&(U.email||U.name)||'—')}</b></div><div class="row"><span>Servidor</span><span class="mu">${esc(API)}</span></div><div class="row"><span>Última respuesta</span><span class="mu">${fmt(lastOk)}</span></div><div class="bar"><button class="btn" data-act="refresh">Actualizar desde la nube</button><button class="btn d" data-act="logout">Cerrar sesión</button></div></div>
 <h2>Hardware</h2><div class="card"><div class="row"><span>ESP32</span><span class="chip wa"><i class="dot"></i>No conectada</span></div><div class="mu">Cuando exista, el equipo escribirá su estado real en <code>state.reported</code>; la app solo lo lee y lo muestra como confirmado.</div></div>`}};
/* ===== AUTH ===== */
function authView(){const reg=authMode==='register';
 return `<div class="login-box"><div class="logo">ARGUSS<small>Casa inteligente</small></div><h1 style="margin-top:20px">${reg?'Crear cuenta':'Iniciar sesión'}</h1><p class="mu">${net==='waking'?'El servidor está despertando, puede tardar hasta un minuto…':'Tus datos se guardan en tu cuenta.'}</p>
 <div style="text-align:left;margin-top:15px"><label class="lbl" for="a-mail">Correo</label><input id="a-mail" type="email" autocomplete="email" placeholder="tu@correo.com"><label class="lbl" for="a-pass">Contraseña</label><input id="a-pass" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="Mínimo 8 caracteres">
 ${reg?'<label class="lbl" for="a-pass2">Repetir contraseña</label><input id="a-pass2" type="password" autocomplete="new-password">':''}
 <button class="btn p" id="a-go" style="width:100%;margin-top:15px" data-act="${reg?'register':'login'}">${reg?'Registrarme':'Ingresar'}</button><div class="err" id="a-err">${esc(bootErr)}</div>
 <div class="bar" style="justify-content:center"><button class="btn" data-act="switch">${reg?'Ya tengo cuenta':'Crear cuenta nueva'}</button></div></div></div>`}
async function authSubmit(reg){
 if(busyAuth)return;const e=$('a-err'),m=$('a-mail').value.trim(),p=$('a-pass').value;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)){e.textContent='Ingresá un correo válido.';return}
 if(p.length<8){e.textContent='La contraseña debe tener al menos 8 caracteres.';return}
 if(reg&&p!==$('a-pass2').value){e.textContent='Las contraseñas no coinciden.';return}
 busyAuth=true;$('a-go').disabled=true;e.textContent='';
 try{let d=await api('POST',reg?'/api/auth/register':'/api/auth/login',{email:m,password:p});
  let tk=d.token||d.accessToken||d.jwt;
  if(!tk&&reg){d=await api('POST','/api/auth/login',{email:m,password:p});tk=d.token||d.accessToken||d.jwt}
  if(!tk)throw new Error('El servidor no devolvió un token.');
  setTok(tk);U=d.user||{email:m};bootErr='';await enter()}
 catch(x){e.textContent=x.message;const b=$('a-go');if(b)b.disabled=false}
 finally{busyAuth=false}}
async function enter(){phase='app';render();try{const d=await api('GET','/api/me');U=d.user||d;await loadRooms()}catch(e){if(token()){toast(e.message,1)}}render()}
function logout(msg){setTok(null);U=null;rooms=[];hist=null;CLM={...CL0};phase='auth';bootErr=msg||'';net='idle';render()}
async function boot(){
 if(!token()){phase='auth';render();return}
 render();try{const d=await api('GET','/api/me');U=d.user||d;await loadRooms();phase='app'}
 catch(e){if(!token()){return}phase='retry';bootErr=e.message}render()}
/* ===== RENDER ===== */
const route=()=>{const h=(location.hash||'#dash').slice(1);return h.startsWith('room-')?['room',h.slice(5)]:[V[h]?h:'dash']};
function updClk(){const n=new Date();if(!$('clk'))return;$('clk').textContent=n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});$('dd').textContent=n.toLocaleDateString('es-AR',{day:'2-digit',month:'short'}).replace('.','').toUpperCase();$('dw').textContent=n.toLocaleDateString('es-AR',{weekday:'long'}).toUpperCase()}
setInterval(updClk,1000);
function render(keep){
 const m=$('main'),ae=document.activeElement;
 if(phase==='boot'){$('nav').innerHTML='';m.innerHTML='<div class="login-box"><div class="logo">ARGUSS</div><p class="mu">'+(net==='waking'?'El servidor está despertando, puede tardar hasta un minuto…':'Recuperando tu sesión…')+'</p></div>';return}
 if(phase==='retry'){$('nav').innerHTML='';m.innerHTML=`<div class="login-box"><div class="logo">ARGUSS</div><p class="err">${esc(bootErr)}</p><div class="bar" style="justify-content:center"><button class="btn p" data-act="retry">Reintentar</button><button class="btn" data-act="logout">Cerrar sesión</button></div></div>`;return}
 if(phase==='auth'){$('nav').innerHTML='';if(!keep||!$('a-mail')||m.dataset.mode!==authMode){m.innerHTML=authView();m.dataset.mode=authMode}else{const p=m.querySelector('.mu');if(p&&net==='waking')p.textContent='El servidor está despertando, puede tardar hasta un minuto…'}return}
 const [v,a]=route();delete m.dataset.mode;
 $('nav').innerHTML='<div class="logo">ARGUSS<small>'+esc(U&&U.email||'')+'</small></div>'+NAV.map(n=>`<a data-go="${n[0]}" tabindex="0" class="${(v===n[0]||(v==='room'&&n[0]==='rooms'))?'on':''}"><span>${ic(n[2])}</span>${n[1]}</a>`).join('');
 if(keep&&ae&&ae.matches&&ae.matches('input:not([type=range]),select'))return;
 const y=scrollY;m.innerHTML=V[v](a);updClk();if(keep)scrollTo(0,y);
 if(v==='seg'&&hist===null)loadHist()}
const go=h=>{location.hash=h;scrollTo(0,0)};
window.addEventListener('hashchange',()=>render());
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='a-pass'||e.target.id==='a-pass2'||e.target.id==='a-mail')authSubmit(authMode==='register');else if(e.target.dataset&&e.target.dataset.go)go(e.target.dataset.go)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='tg')setClim({target:+t.value});else if(t.id==='f-room'){filt=t.value;render()}});
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition,o=$('vmsg');if(!R){o.textContent='Este navegador no admite voz. Probá con Chrome o Safari.';return}
 const r=new R();r.lang='es-AR';o.textContent='Escuchando…';r.onerror=()=>{o.textContent='No te escuché. Probá de nuevo.'};
 r.onresult=e=>{const q=e.results[0][0].transcript,N=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\buno\b/g,'1').replace(/\bdos\b/g,'2'),Q=N(q).split(/\s+/),on=/prend|encend/.test(N(q)),off=/apag/.test(N(q));
  if(!on&&!off){o.textContent='“'+q+'” · Decí prendé o apagá y el ambiente.';return}
  let T;if(Q.includes('todas')){if(!confirm((on?'¿Ordenar encender':'¿Ordenar apagar')+' todas las luces?'))return;T=rooms}
  else{const sc=rooms.map(r=>[r,N(r.name).split(/[-\s]+/).filter(w=>w.length>2&&Q.includes(w)).length]),m=Math.max(...sc.map(x=>x[1]),0),hit=sc.filter(x=>x[1]===m&&m>0);if(hit.length!==1){o.textContent='“'+q+'” · No identifiqué el ambiente.';return}T=[hit[0][0]]}
  let n=0;T.forEach(r=>{let ch=0;r.lights.forEach(d=>{if(d.on!==on){d.on=on;ch++}});if(ch){n+=ch;save(r)}});render(1);$('vmsg').textContent='“'+q+'” · '+(n?n+' orden(es) guardada(s)':'Sin cambios')};r.start()}
document.addEventListener('click',async e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='login'||a==='register'){authSubmit(a==='register');return}
 if(a==='switch'){authMode=authMode==='login'?'register':'login';bootErr='';render();return}
 if(a==='logout'){logout();return}
 if(a==='retry'){phase='boot';net='idle';boot();return}
 if(a==='tog'){const r=roomOf(id),d=r&&r.lights.find(x=>x.id===id);if(d&&!r.sv)setLight(d,!d.on);return}
 if(a==='all'){const on=b.dataset.v==='1';if(!confirm((on?'¿Ordenar encender':'¿Ordenar apagar')+' todas las luces de la casa?'))return;
  rooms.forEach(r=>{let ch=0;r.lights.forEach(d=>{if(d.on!==on){d.on=on;ch++}});if(ch)save(r)});render(1);return}
 if(a==='boiler'){setClim({boiler:!CLM.boiler});return}
 if(a==='ac'){setClim({ac:!CLM.ac});return}
 if(a==='tgt'){const v=+(CLM.target+ +b.dataset.v).toFixed(1);if(v>=16&&v<=30)setClim({target:v});return}
 if(a==='mode'){setClim({mode:b.dataset.v});return}
 if(a==='th'){const l=+$('th-low').value,h=+$('th-high').value,er=$('th-err');
  if(isNaN(l)||isNaN(h)||l>=h){er.textContent='El límite de caldera debe ser menor que el del aire acondicionado.';return}setClim({low:l,high:h});er.textContent='';return}
 if(a==='hist'){hist=null;render(1);loadHist();return}
 if(a==='refresh'){try{await loadRooms();toast('Datos actualizados')}catch(x){toast(x.message,1)}render(1);return}
 if(a==='voice'){voice();return}});
/* ===== ARRANQUE ===== */
setInterval(async()=>{if(phase!=='app'||document.hidden||rooms.some(r=>r.sv)||ct)return;try{await loadRooms();render(1)}catch(e){render(1)}},POLL_MS);
boot();
</script></body></html>
